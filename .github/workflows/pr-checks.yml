name: PR Checks

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-typecheck:
    name: Game · TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - name: Install
        run: cd game && yarn install
      - name: Type check
        run: cd game && npx tsc --noEmit -p tsconfig.json

  game-tests:
    name: Game · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - name: Install
        run: cd game && yarn install
      - name: Colony tests (runs only if tests/colony/ exists)
        run: |
          if [ -d game/tests/colony ]; then
            cd game && yarn colony:test
          else
            echo "No colony tests directory — skipping."
          fi
      - name: Engine tests (runs only if tests/engine/ exists)
        run: |
          if [ -d game/tests/engine ]; then
            cd game && yarn engine:test
          else
            echo "No engine tests directory — skipping."
          fi

  game-browser-tests:
    name: Game · Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - name: Install
        run: cd game && yarn install
      - name: Install Playwright Chromium
        run: cd game && yarn playwright install --with-deps chromium
      - name: Browser tests
        run: cd game && yarn browser:test --workers=1 --retries=0 --trace=retain-on-failure --reporter=list,json
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/sector-zero-browser-results
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/sector-zero-browser-results/report.json
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-browser-results
          path: ${{ runner.temp }}/sector-zero-browser-results
          retention-days: 7

  site-browser-tests:
    name: Site · Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - name: Install browser harness and site
        run: |
          (cd game && yarn install --immutable)
          (cd site && yarn install --immutable)
      - name: Install Playwright Chromium
        run: cd game && yarn playwright install --with-deps chromium
      - name: Site browser tests
        run: cd game && yarn playwright test --config playwright.site.config.ts --workers=1 --retries=0 --trace=retain-on-failure --reporter=list,json
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/sector-zero-site-browser-results
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/sector-zero-site-browser-results/report.json
      - name: Retain site browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-browser-results
          path: ${{ runner.temp }}/sector-zero-site-browser-results
          retention-days: 7

  game-build:
    name: Game · Next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - name: Install
        run: cd game && yarn install
      - name: Build
        run: cd game && yarn build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /sector-zero

  site-build:
    name: Site · Next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: site/yarn.lock
      - run: corepack enable
      - name: Install
        run: cd site && yarn install
      - name: Build
        run: cd site && yarn build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /sector-zero/site
